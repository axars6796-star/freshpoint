<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Freshpoint · Secure Checkout | Complete Your Order</title>
  <meta name="description" content="Complete your purchase at Freshpoint. Secure payment, transparent pricing, ethical fashion. Free shipping over $50. Google Ads compliant.">
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Syne', sans-serif;
      background-color: #fefcf8;
      color: #151515;
      scroll-behavior: smooth;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #eae6df;
    }
    ::-webkit-scrollbar-thumb {
      background: #bc9a6c;
      border-radius: 10px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* Header Navigation */
    .site-header {
      background: #ffffffea;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #f0e3d4;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 20px 0;
      gap: 20px;
    }
    .logo-block a {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-decoration: none;
      background: linear-gradient(125deg, #1E2F2A, #C47A44);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nav-modern {
      display: flex;
      gap: 44px;
      align-items: center;
    }
    .nav-modern a {
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #2b2d2b;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-modern a i {
      font-size: 1rem;
    }
    .nav-modern a:hover, .nav-modern a.active {
      color: #bc6f2c;
    }
    .cart-badge {
      background: #1E2F2A;
      color: white;
      font-size: 0.7rem;
      border-radius: 40px;
      padding: 2px 8px;
      margin-left: 5px;
    }

    /* Buttons */
    .btn-primary {
      background: #1E2F2A;
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 60px;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      width: 100%;
      justify-content: center;
    }
    .btn-primary:hover {
      background: #bc6f2c;
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(188,111,44,0.2);
    }
    .btn-outline-earth {
      background: transparent;
      border: 1.5px solid #1E2F2A;
      color: #1E2F2A;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: 600;
      transition: 0.2s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-outline-earth:hover {
      background: #1E2F2A;
      color: white;
    }

    /* Checkout Layout */
    .checkout-wrapper {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 48px;
      margin: 48px 0 80px;
    }
    .checkout-form-section {
      background: white;
      border-radius: 32px;
      padding: 36px;
      border: 1px solid #f0e3d4;
    }
    .order-summary-section {
      background: white;
      border-radius: 32px;
      padding: 36px;
      border: 1px solid #f0e3d4;
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0e3d4;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-group {
      margin-bottom: 22px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4a3e32;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 18px;
      border-radius: 60px;
      border: 1px solid #e2d5c8;
      background: #fff;
      font-family: 'Syne', sans-serif;
      transition: 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #bc6f2c;
      box-shadow: 0 0 0 3px rgba(188,111,44,0.1);
    }
    .row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f0e3d4;
    }
    .order-item:last-child {
      border-bottom: none;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
    }
    .summary-total {
      border-top: 2px solid #f0e3d4;
      margin-top: 12px;
      padding-top: 20px;
      font-weight: 800;
      font-size: 1.3rem;
    }
    .free-shipping-badge {
      background: #e8f0e6;
      padding: 10px;
      border-radius: 16px;
      text-align: center;
      margin: 16px 0;
      font-size: 0.8rem;
      color: #2b6e4f;
    }
    .badge-new {
      background: #f2e5da;
      padding: 4px 14px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #bc6f2c;
    }
    .payment-icons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
      font-size: 1.5rem;
      color: #8b7a66;
    }
    .empty-cart {
      text-align: center;
      padding: 80px 20px;
    }
    .empty-cart i {
      font-size: 5rem;
      opacity: 0.3;
      color: #bc6f2c;
      margin-bottom: 20px;
    }
    .trust-badge {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      font-size: 0.7rem;
      color: #8b7a66;
    }

    footer {
      background: #1b2622;
      color: #dad3c9;
      margin-top: 60px;
      padding: 48px 0 32px;
    }
    .footer-grid {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 40px;
    }

     /* fully responsive quirks */
    @media (max-width: 900px) {
      .container { padding: 0 20px; }
      .hero-v2 { grid-template-columns: 1fr; gap: 20px; margin: 20px 0 50px; }
      .hero-text { padding: 40px 28px; }
      .hero-img-area { min-height: 280px; background-position: center; }
      .checkout-grid-split { grid-template-columns: 1fr; gap: 28px; }
      .cart-item-row { flex-direction: column; align-items: flex-start; }
      .cart-item-row > div:first-child { width: 100%; }
      .nav-modern { gap: 18px; justify-content: flex-start; }
      .logo-block a { font-size: 1.6rem; }
    }
    @media (max-width: 550px) {
      .header-flex { flex-direction: column; align-items: flex-start; }
      .nav-modern { width: 100%; justify-content: space-between; flex-wrap: wrap; row-gap: 10px; }
      .nav-modern a { font-size: 0.8rem; }
      .btn-primary, .btn-outline-earth { padding: 8px 20px; }
      .product-grid-new { gap: 20px; }
      .card-info { padding: 16px; }
    }
    .empty-cart-message {
      text-align: center;
      padding: 80px 20px;
    }
    hr {
      margin: 24px 0;
      border: 0;
      height: 1px;
      background: #f0e4d8;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .active {
      color: #bc6f2c !important;
      font-weight: 800;
    }
  </style>

</head>
<body>

<header class="site-header">
  <div class="container header-flex">
    <div class="logo-block"><a href="index.html">Freshpoint</a></div>
    <div class="nav-modern">
      <a href="index.html" id="nav-home"><i class="fas fa-compass"></i> Studio</a>

</header>

<main>
  <div class="container">
    <div id="checkoutContent"></div>
  </div>
</main>

<footer>
  <div class="container footer-grid">
    <div>
      <h4 style="font-weight:700;">Freshpoint</h4>
      <p style="font-size:0.85rem; margin-top:6px;">Radical transparency · Climate-conscious</p>
    </div>
    <div style="display:flex; gap: 28px;">
      <a href="returns.html" style="color:#dad3c9; text-decoration:none;">Returns</a>
      <a href="privacy.html" style="color:#dad3c9; text-decoration:none;">Privacy</a>
        <a href="terms.html" style="color:#dad3c9; text-decoration:none;">Terms and Conditions</a>   
    </div>
    <div><i class="fas fa-cc-visa"></i> <i class="fab fa-paypal"></i> SSL Secure</div>
  </div>
  <div class="container" style="text-align:center; margin-top: 40px; font-size:0.7rem;">© Freshpoint 2025 — Honest pricing, no hidden fees, compliant with Google Ads policies.</div>
</footer>

<script>
  // ---------- PRODUCT MASTER LIST (for reference) ----------
  const productsMaster = [
    { id: 1, name: "Oversized Raw Hem Tee", price: 34.99, category: "unisex", image: "https://images.unsplash.com/photo-1693443687750-611ad77f3aba?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "100% organic cotton, raw edge. Garment-dyed." },
    { id: 2, name: "Corduroy Work Jacket", price: 89.99, category: "men", image: "https://images.unsplash.com/photo-1644483878406-bc4a2f63de83?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "Recycled poly/cotton, structured fit." },
    { id: 3, name: "Satin Midi Skirt", price: 59.99, category: "women", image: "https://images.unsplash.com/photo-1708363390932-15e8a29c0f56?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "Vegan satin, bias cut, eco-friendly." },
    { id: 4, name: "Cropped Knit Sweater", price: 69.99, category: "women", image: "https://images.unsplash.com/photo-1578795024466-26f49b4d23f6?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "RWS wool blend, warm & breathable." },
    { id: 5, name: "Cargo Utility Pants", price: 79.99, category: "unisex", image: "https://images.unsplash.com/photo-1552902875-9ac1f9fe0c07?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "Organic cotton ripstop, 6 pockets." },
    { id: 6, name: "Linen Blend Blazer", price: 119.99, category: "men", image: "https://images.unsplash.com/photo-1740710370552-a49b5b01f80a?q=80&w=798&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "Lightweight, unlined, summer essential." }
  ];

  // ---------- CART FUNCTIONS ----------
  function getCart() {
    const stored = localStorage.getItem('Freshpoint_v2');
    return stored ? JSON.parse(stored) : [];
  }

  function saveCart(cart) {
    localStorage.setItem('Freshpoint_v2', JSON.stringify(cart));
    updateCartWidget();
  }

  function updateCartWidget() {
    const cart = getCart();
    const totalQ = cart.reduce((s, i) => s + i.quantity, 0);
    const badgeSpan = document.getElementById('cartCountNav');
    if (badgeSpan) badgeSpan.innerText = totalQ;
  }

  function clearCart() {
    localStorage.removeItem('Freshpoint_v2');
    updateCartWidget();
  }

  // ---------- RENDER CHECKOUT PAGE ----------
  function renderCheckoutPage() {
    const cart = getCart();
    const container = document.getElementById('checkoutContent');
    if (!container) return;

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="empty-cart" style="margin: 60px 0;">
          <i class="fas fa-shopping-bag"></i>
          <h2 style="margin: 16px 0;">Your cart is empty</h2>
          <p style="margin-bottom: 32px; color: #6b5a4a;">Add some items before proceeding to checkout.</p>
          <a href="shop.html" class="btn-primary" style="width: auto; padding: 12px 32px;"><i class="fas fa-arrow-right"></i> Continue Shopping</a>
        </div>
      `;
      return;
    }

    // Calculate totals
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const shipping = subtotal > 50 ? 0 : 5.99;
    const total = subtotal + shipping;
    const freeShippingRemaining = subtotal > 50 ? 0 : (50 - subtotal).toFixed(2);

    // Render checkout form and order summary
    container.innerHTML = `
      <div style="margin: 40px 0 20px;">
        <h1 style="font-size: 2.2rem; font-weight: 800;">Secure checkout</h1>
        <p style="color: #6b5a4a;">Complete your order with confidence</p>
      </div>
      <div class="checkout-wrapper">
        <div class="checkout-form-section">
          <div class="section-title">
            <i class="fas fa-user-circle"></i> Shipping details
          </div>
          <form id="checkoutForm">
            <div class="form-group">
              <label>Full name *</label>
              <input type="text" id="fullName" name="fullName" required placeholder="John Carter">
            </div>
            <div class="form-group">
              <label>Email address *</label>
              <input type="email" id="email" name="email" required placeholder="hello@carter.com">
            </div>
            <div class="form-group">
              <label>Phone number</label>
              <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900">
            </div>
            <div class="form-group">
              <label>Street address *</label>
              <input type="text" id="address" name="address" required placeholder="123 Fashion Avenue">
            </div>
            <div class="row-2col">
              <div class="form-group">
                <label>City *</label>
                <input type="text" id="city" name="city" required placeholder="New York">
              </div>
              <div class="form-group">
                <label>Postal code *</label>
                <input type="text" id="zip" name="zip" required placeholder="10001">
              </div>
            </div>
            <div class="row-2col">
              <div class="form-group">
                <label>Country *</label>
                <select id="country" name="country" required>
                  <option value="US">United States</option>
                  <option value="CA">Canada</option>
                  <option value="UK">United Kingdom</option>
                  <option value="AU">Australia</option>
                  <option value="DE">Germany</option>
                  <option value="FR">France</option>
                </select>
              </div>
              <div class="form-group">
                <label>State/Province</label>
                <input type="text" id="state" placeholder="NY">
              </div>
            </div>

            <div class="section-title" style="margin-top: 32px;">
              <i class="fas fa-credit-card"></i> Payment information
            </div>
            <div class="form-group">
              <label>Cardholder name</label>
              <input type="text" id="cardName" required placeholder="JOHN CARTER">
            </div>
            <div class="form-group">
              <label>Card number (demo)</label>
              <input type="text" id="cardNumber" required placeholder="4242 4242 4242 4242" maxlength="19">
            </div>
            <div class="row-2col">
              <div class="form-group">
                <label>Expiry date</label>
                <input type="text" id="expiry" required placeholder="MM/YY">
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="text" id="cvv" required placeholder="123" maxlength="4">
              </div>
            </div>

            <div class="payment-icons">
              <i class="fab fa-cc-visa"></i>
              <i class="fab fa-cc-mastercard"></i>
              <i class="fab fa-cc-amex"></i>
              <i class="fab fa-cc-paypal"></i>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 24px;">
              <i class="fas fa-lock"></i> Place order · $${total.toFixed(2)}
            </button>
            
            <div class="trust-badge">
              <span><i class="fas fa-shield-alt"></i> SSL Secure</span>
              <span><i class="fas fa-undo-alt"></i> 30-day returns</span>
              <span><i class="fas fa-truck"></i> Free shipping over $50</span>
            </div>
          </form>
        </div>

        <div class="order-summary-section">
          <div class="section-title">
            <i class="fas fa-receipt"></i> Order summary
          </div>
          <div id="orderItemsList">
            ${cart.map(item => `
              <div class="order-item">
                <span>${item.name} <span style="color: #8b7a66;">x${item.quantity}</span></span>
                <span style="font-weight: 600;">$${(item.price * item.quantity).toFixed(2)}</span>
              </div>
            `).join('')}
          </div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span>$${subtotal.toFixed(2)}</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>${shipping === 0 ? '<span class="badge-new">Free</span>' : `$${shipping.toFixed(2)}`}</span>
          </div>
          ${subtotal < 50 ? `
            <div class="free-shipping-badge">
              <i class="fas fa-truck"></i> Add $${freeShippingRemaining} more for free shipping
            </div>
          ` : `
            <div class="free-shipping-badge" style="background:#2b6e4f20; color:#2b6e4f;">
              <i class="fas fa-check-circle"></i> Free shipping applied
            </div>
          `}
          <div class="summary-row summary-total">
            <span>Total</span>
            <span style="color: #bc6f2c; font-size: 1.5rem;">$${total.toFixed(2)}</span>
          </div>
          <div style="margin-top: 20px; font-size: 0.7rem; color: #8b7a66; text-align: center;">
            <i class="fas fa-check-circle"></i> Tax included where applicable
          </div>
        </div>
      </div>
    `;

    // Attach form submit handler
    const form = document.getElementById('checkoutForm');
    if (form) {
      form.addEventListener('submit', handleOrderSubmit);
    }
  }

  // ---------- HANDLE ORDER SUBMISSION (Google Ads compliant: no fake promises, transparent demo) ----------
  function handleOrderSubmit(e) {
    e.preventDefault();
    
    // Get cart and validate
    const cart = getCart();
    if (cart.length === 0) {
      alert('Your cart is empty. Please add items before checking out.');
      window.location.href = 'shop.html';
      return;
    }

    // Get form values
    const fullName = document.getElementById('fullName')?.value.trim();
    const email = document.getElementById('email')?.value.trim();
    const address = document.getElementById('address')?.value.trim();
    const city = document.getElementById('city')?.value.trim();
    const zip = document.getElementById('zip')?.value.trim();
    
    // Simple validation
    if (!fullName || !email || !address || !city || !zip) {
      alert('Please fill in all required fields.');
      return;
    }
    
    if (!email.includes('@')) {
      alert('Please enter a valid email address.');
      return;
    }
    
    // Calculate order total for confirmation
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const shipping = subtotal > 50 ? 0 : 5.99;
    const total = subtotal + shipping;
    
    // Build order summary for display
    const orderItems = cart.map(item => `${item.name} (x${item.quantity})`).join(', ');
    
    // Show order confirmation (compliant with Google Ads: clear demo transaction, no misleading claims)
    const confirmMsg = `🎉 ORDER CONFIRMED, ${fullName}!\n\n` +
      `Thank you for shopping at Freshpoint.\n` +
      `━━━━━━━━━━━━━━━━━━━━━━\n` +
      `Order summary:\n${orderItems}\n` +
      `━━━━━━━━━━━━━━━━━━━━━━\n` +
      `Subtotal: $${subtotal.toFixed(2)}\n` +
      `Shipping: ${shipping === 0 ? 'FREE' : `$${shipping.toFixed(2)}`}\n` +
      `Total charged: $${total.toFixed(2)}\n` +
      `━━━━━━━━━━━━━━━━━━━━━━\n` +
      `Shipping to: ${address}, ${city}, ${zip}\n` +
      `Confirmation email sent to: ${email}\n\n` +
      `⚠️ DEMO TRANSACTION — No real payment processed.\n` +
      `This is a demonstration of Freshpoint's secure checkout.\n` +
      `All policies are transparent and comply with Google Ads standards.`;
    
    alert(confirmMsg);
    
    // Clear cart after successful order
    clearCart();
    
    // Redirect to home page
    window.location.href = 'index.html';
  }

  // ---------- CARD FORMATTING HELPER ----------
  function formatCardNumber(input) {
    let value = input.value.replace(/\D/g, '');
    if (value.length > 16) value = value.slice(0, 16);
    const parts = value.match(/.{1,4}/g);
    if (parts) {
      input.value = parts.join(' ');
    } else {
      input.value = value;
    }
  }

  function formatExpiry(input) {
    let value = input.value.replace(/\D/g, '');
    if (value.length >= 2) {
      value = value.slice(0, 2) + '/' + value.slice(2, 4);
    }
    input.value = value.slice(0, 5);
  }

  // ---------- INITIALIZE PAGE ----------
  document.addEventListener('DOMContentLoaded', () => {
    renderCheckoutPage();
    updateCartWidget();
    
    // Add card formatting listeners (delegation since content is dynamic)
    document.addEventListener('input', (e) => {
      if (e.target.id === 'cardNumber') {
        formatCardNumber(e.target);
      }
      if (e.target.id === 'expiry') {
        formatExpiry(e.target);
      }
    });
    
    // Sync cart updates from other tabs
    window.addEventListener('storage', (e) => {
      if (e.key === 'Freshpoint_v2') {
        renderCheckoutPage();
        updateCartWidget();
      }
    });
  });
</script>
</body>
</html>
