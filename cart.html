<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Freshpoint · Your Shopping Bag | Secure Checkout</title>
  <meta name="description" content="Review your items at Freshpoint. Sustainable fashion, transparent pricing, free shipping over $50. Easy returns.">
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Syne', sans-serif;
      background-color: #fefcf8;
      color: #151515;
      scroll-behavior: smooth;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #eae6df;
    }
    ::-webkit-scrollbar-thumb {
      background: #bc9a6c;
      border-radius: 10px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* Header Navigation */
    .site-header {
      background: #ffffffea;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #f0e3d4;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 20px 0;
      gap: 20px;
    }
    .logo-block a {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-decoration: none;
      background: linear-gradient(125deg, #1E2F2A, #C47A44);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nav-modern {
      display: flex;
      gap: 44px;
      align-items: center;
    }
    .nav-modern a {
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #2b2d2b;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-modern a i {
      font-size: 1rem;
    }
    .nav-modern a:hover, .nav-modern a.active {
      color: #bc6f2c;
    }
    .cart-badge {
      background: #1E2F2A;
      color: white;
      font-size: 0.7rem;
      border-radius: 40px;
      padding: 2px 8px;
      margin-left: 5px;
    }

    /* Buttons */
    .btn-primary {
      background: #1E2F2A;
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 60px;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn-primary:hover {
      background: #bc6f2c;
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(188,111,44,0.2);
    }
    .btn-outline-earth {
      background: transparent;
      border: 1.5px solid #1E2F2A;
      color: #1E2F2A;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: 600;
      transition: 0.2s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-outline-earth:hover {
      background: #1E2F2A;
      color: white;
    }
    .btn-sm {
      padding: 6px 16px;
      font-size: 0.75rem;
    }
    .btn-danger {
      background: transparent;
      border: 1px solid #d4a373;
      color: #b85c1a;
    }
    .btn-danger:hover {
      background: #b85c1a;
      color: white;
      border-color: #b85c1a;
    }

    /* Cart Layout */
    .cart-wrapper {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 48px;
      margin: 48px 0 80px;
    }
    .cart-items-section {
      background: white;
      border-radius: 32px;
      padding: 32px;
      border: 1px solid #f0e3d4;
    }
    .cart-summary-section {
      background: white;
      border-radius: 32px;
      padding: 32px;
      border: 1px solid #f0e3d4;
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0e3d4;
    }
    .cart-item {
      display: flex;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid #f0e3d4;
    }
    .cart-item:last-child {
      border-bottom: none;
    }
    .cart-item-image {
      width: 100px;
      height: 120px;
      object-fit: cover;
      border-radius: 20px;
      background: #ede5db;
    }
    .cart-item-details {
      flex: 2;
    }
    .cart-item-name {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .cart-item-price {
      color: #bc6f2c;
      font-weight: 600;
      margin: 6px 0;
    }
    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    .qty-btn {
      background: #f5f0ea;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .qty-btn:hover {
      background: #e0d5ca;
    }
    .cart-item-total {
      text-align: right;
      min-width: 100px;
    }
    .cart-item-total .amount {
      font-weight: 800;
      font-size: 1.2rem;
      color: #1E2F2A;
    }
    .remove-link {
      color: #b85c1a;
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 8px;
      display: inline-block;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
    }
    .summary-total {
      border-top: 2px solid #f0e3d4;
      margin-top: 12px;
      padding-top: 20px;
      font-weight: 800;
      font-size: 1.3rem;
    }
    .free-shipping-badge {
      background: #e8f0e6;
      padding: 10px;
      border-radius: 16px;
      text-align: center;
      margin: 16px 0;
      font-size: 0.8rem;
      color: #2b6e4f;
    }
    .empty-cart {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-cart i {
      font-size: 5rem;
      opacity: 0.3;
      color: #bc6f2c;
      margin-bottom: 20px;
    }
    .badge-new {
      background: #f2e5da;
      padding: 4px 14px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #bc6f2c;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1E2F2A;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 0.85rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .toast-msg.show {
      opacity: 1;
    }

    footer {
      background: #1b2622;
      color: #dad3c9;
      margin-top: 60px;
      padding: 48px 0 32px;
    }
    .footer-grid {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 40px;
    }

    /* fully responsive quirks */
    @media (max-width: 900px) {
      .container { padding: 0 20px; }
      .hero-v2 { grid-template-columns: 1fr; gap: 20px; margin: 20px 0 50px; }
      .hero-text { padding: 40px 28px; }
      .hero-img-area { min-height: 280px; background-position: center; }
      .checkout-grid-split { grid-template-columns: 1fr; gap: 28px; }
      .cart-item-row { flex-direction: column; align-items: flex-start; }
      .cart-item-row > div:first-child { width: 100%; }
      .nav-modern { gap: 18px; justify-content: flex-start; }
      .logo-block a { font-size: 1.6rem; }
    }
    @media (max-width: 550px) {
      .header-flex { flex-direction: column; align-items: flex-start; }
      .nav-modern { width: 100%; justify-content: space-between; flex-wrap: wrap; row-gap: 10px; }
      .nav-modern a { font-size: 0.8rem; }
      .btn-primary, .btn-outline-earth { padding: 8px 20px; }
      .product-grid-new { gap: 20px; }
      .card-info { padding: 16px; }
    }
    .empty-cart-message {
      text-align: center;
      padding: 80px 20px;
    }
    hr {
      margin: 24px 0;
      border: 0;
      height: 1px;
      background: #f0e4d8;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .active {
      color: #bc6f2c !important;
      font-weight: 800;
    }
  </style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NTV0NLN2X5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-NTV0NLN2X5');
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-flex">
    <div class="logo-block"><a href="index.html">Freshpoint</a></div>
    <div class="nav-modern">
      <a href="index.html" id="nav-home"><i class="fas fa-compass"></i> Studio</a>
      <a href="shop.html" id="nav-shop"><i class="fas fa-vest"></i> Archive</a>
      <a href="cart.html" id="nav-cart" class="active"><i class="fas fa-bag-shopping"></i> Bag <span id="cartCountNav" class="cart-badge">0</span></a>
      <a href="checkout.html" id="nav-checkout"><i class="fas fa-shield-alt"></i> Secure</a>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div id="cartContent"></div>
  </div>
</main>

<footer>
  <div class="container footer-grid">
    <div>
      <h4 style="font-weight:700;">Freshpoint</h4>
      <p style="font-size:0.85rem; margin-top:6px;">Radical transparency · Climate-conscious</p>
    </div>
    <div style="display:flex; gap: 28px;">
      <a href="returns.html" style="color:#dad3c9; text-decoration:none;">Returns</a>
      <a href="privacy.html" style="color:#dad3c9; text-decoration:none;">Privacy</a>
      <a href="terms.html" style="color:#dad3c9; text-decoration:none;">Terms and Conditions</a>
    </div>
    <div><i class="fas fa-cc-visa"></i> <i class="fab fa-paypal"></i> SSL Secure</div>
  </div>
  <div class="container" style="text-align:center; margin-top: 40px; font-size:0.7rem;">© Freshpoint 2025 — Honest pricing, no hidden fees, compliant with Google Ads policies.</div>
</footer>

<div id="toastMsg" class="toast-msg"><i class="fas fa-check-circle"></i> Cart updated</div>

<script>
  // ---------- PRODUCT MASTER LIST (for reference when adding) ----------
  const productsMaster = [
  { id: 1, name: "Oversized Raw Hem Tee", price: 34.99, category: "unisex", image: "https://images.unsplash.com/photo-1693443687750-611ad77f3aba?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "100% organic cotton, raw edge. Garment-dyed." },
    { id: 2, name: "Corduroy Work Jacket", price: 89.99, category: "men", image: "https://images.unsplash.com/photo-1644483878406-bc4a2f63de83?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "Recycled poly/cotton, structured fit." },
    { id: 3, name: "Satin Midi Skirt", price: 59.99, category: "women", image: "https://images.unsplash.com/photo-1708363390932-15e8a29c0f56?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "Vegan satin, bias cut, eco-friendly." },
    { id: 4, name: "Cropped Knit Sweater", price: 69.99, category: "women", image: "https://images.unsplash.com/photo-1578795024466-26f49b4d23f6?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "RWS wool blend, warm & breathable." },
    { id: 5, name: "Cargo Utility Pants", price: 79.99, category: "unisex", image: "https://images.unsplash.com/photo-1552902875-9ac1f9fe0c07?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "Organic cotton ripstop, 6 pockets." },
    { id: 6, name: "Linen Blend Blazer", price: 119.99, category: "men", image: "https://images.unsplash.com/photo-1740710370552-a49b5b01f80a?q=80&w=798&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", description: "Lightweight, unlined, summer essential." }
  ];

  // ---------- CART FUNCTIONS ----------
  function getCart() {
    const stored = localStorage.getItem('Freshpoint_v2');
    return stored ? JSON.parse(stored) : [];
  }

  function saveCart(cart) {
    localStorage.setItem('Freshpoint_v2', JSON.stringify(cart));
    updateCartWidget();
    renderCartPage(); // re-render cart page
  }

  function updateCartWidget() {
    const cart = getCart();
    const totalQ = cart.reduce((s, i) => s + i.quantity, 0);
    const badgeSpan = document.getElementById('cartCountNav');
    if (badgeSpan) badgeSpan.innerText = totalQ;
  }

  function showToast(message) {
    const toast = document.getElementById('toastMsg');
    toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }

  function updateQuantity(productId, newQuantity) {
    if (newQuantity < 1) {
      removeFromCart(productId);
      return;
    }
    let cart = getCart();
    const item = cart.find(i => i.id === productId);
    if (item) {
      item.quantity = newQuantity;
      saveCart(cart);
      showToast('Quantity updated');
    }
  }

  function removeFromCart(productId) {
    let cart = getCart();
    cart = cart.filter(i => i.id !== productId);
    saveCart(cart);
    showToast('Item removed');
  }

  function clearCart() {
    if (confirm('Remove all items from your bag?')) {
      saveCart([]);
      showToast('Cart cleared');
    }
  }

  // ---------- RENDER CART PAGE ----------
  function renderCartPage() {
    const cart = getCart();
    const container = document.getElementById('cartContent');
    if (!container) return;

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="empty-cart" style="margin: 60px 0;">
          <i class="fas fa-shopping-bag"></i>
          <h2 style="margin: 16px 0;">Your bag is empty</h2>
          <p style="margin-bottom: 32px; color: #6b5a4a;">Add some sustainable pieces to get started.</p>
          <a href="shop.html" class="btn-primary"><i class="fas fa-arrow-right"></i> Continue Shopping</a>
        </div>
      `;
      return;
    }

    // Calculate totals
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const shipping = subtotal > 50 ? 0 : 5.99;
    const total = subtotal + shipping;
    const freeShippingRemaining = subtotal > 50 ? 0 : (50 - subtotal).toFixed(2);

    // Render cart items and summary
    container.innerHTML = `
      <div style="margin: 40px 0 20px;">
        <h1 style="font-size: 2.2rem; font-weight: 800;">Your bag</h1>
        <p style="color: #6b5a4a;">${cart.reduce((s,i)=>s+i.quantity,0)} items</p>
      </div>
      <div class="cart-wrapper">
        <div class="cart-items-section">
          <div class="section-title"><i class="fas fa-bag-shopping"></i> Cart items</div>
          ${cart.map(item => {
            const itemTotal = (item.price * item.quantity).toFixed(2);
            return `
              <div class="cart-item" data-id="${item.id}">
                <img class="cart-item-image" src="${item.image}" alt="${item.name}">
                <div class="cart-item-details">
                  <div class="cart-item-name">${item.name}</div>
                  <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                  <div class="cart-item-quantity">
                    <button class="qty-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                    <span style="min-width: 32px; text-align: center;">${item.quantity}</span>
                    <button class="qty-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                  </div>
                  <div class="remove-link" onclick="removeFromCart(${item.id})">
                    <i class="fas fa-trash-alt"></i> Remove
                  </div>
                </div>
                <div class="cart-item-total">
                  <div class="amount">$${itemTotal}</div>
                  <div style="font-size: 0.7rem; color: #8b7a66;">total</div>
                </div>
              </div>
            `;
          }).join('')}
          <div style="margin-top: 24px; text-align: right;">
            <button class="btn-outline-earth btn-sm" onclick="clearCart()">
              <i class="fas fa-trash"></i> Clear all
            </button>
          </div>
        </div>

        <div class="cart-summary-section">
          <div class="section-title">Order summary</div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span>$${subtotal.toFixed(2)}</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>${shipping === 0 ? '<span class="badge-new">Free</span>' : `$${shipping.toFixed(2)}`}</span>
          </div>
          ${subtotal < 50 ? `
            <div class="free-shipping-badge">
              <i class="fas fa-truck"></i> Add $${freeShippingRemaining} more to get free shipping
            </div>
          ` : `
            <div class="free-shipping-badge" style="background:#2b6e4f20; color:#2b6e4f;">
              <i class="fas fa-check-circle"></i> You qualify for free shipping!
            </div>
          `}
          <div class="summary-row summary-total">
            <span>Total</span>
            <span style="color: #bc6f2c; font-size: 1.5rem;">$${total.toFixed(2)}</span>
          </div>
          <div style="margin-top: 24px;">
            <a href="checkout.html" class="btn-primary" style="width: 100%; justify-content: center;">
              <i class="fas fa-lock"></i> Proceed to checkout
            </a>
          </div>
          <div style="margin-top: 20px; text-align: center; font-size: 0.7rem; color: #8b7a66;">
            <i class="fas fa-shield-alt"></i> Secure 256-bit SSL encryption
          </div>
        </div>
      </div>
    `;
  }

  // ---------- INITIALIZE PAGE ----------
  document.addEventListener('DOMContentLoaded', () => {
    renderCartPage();
    updateCartWidget();

    // Make functions globally available for inline onclick
    window.updateQuantity = updateQuantity;
    window.removeFromCart = removeFromCart;
    window.clearCart = clearCart;
    window.getCart = getCart;

    // Sync any cart updates from other tabs (optional)
    window.addEventListener('storage', (e) => {
      if (e.key === 'Freshpoint_v2') {
        renderCartPage();
        updateCartWidget();
      }
    });
  });
</script>
</body>
</html>
